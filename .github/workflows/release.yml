name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): update versions"
          title: "chore(release): update versions"
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify playground of new meta-cloud-api release
        # Current changesets/action exposes partial-publish outputs. Registry time
        # remains a fallback for action versions/failures without those outputs.
        if: ${{ !cancelled() && (steps.changesets.outputs.published == 'true' || steps.changesets.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PLAYGROUND_DISPATCH_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::PLAYGROUND_DISPATCH_TOKEN is not set; run sdk-update manually in the playground repository.'
            exit 0
          fi
          version="$(jq -r '[.[] | select(.name == "meta-cloud-api") | .version][0] // ""' <<< "${PUBLISHED_PACKAGES:-[]}")"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
            published_at=""
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              published_at="$(npm view meta-cloud-api time --json --fetch-retries=0 --fetch-timeout=10000 2>/dev/null | jq -r --arg v "$version" '.[$v] // empty' || true)"
              [ -n "$published_at" ] && break
              sleep 20
            done
            if [ -z "$published_at" ]; then
              echo "::error::Could not confirm publication of meta-cloud-api@$version. Run playground sdk-update manually after registry propagation."
              exit 1
            fi
            if [ "$(date -u -d "$published_at" +%s)" -lt "$JOB_STARTED_AT" ]; then
              echo "meta-cloud-api@$version predates this run; skipping dispatch."
              exit 0
            fi
          fi
          payload_file="$RUNNER_TEMP/playground-dispatch.json"
          jq -n --arg version "$version" \
            '{event_type: "meta-cloud-api-released", client_payload: {version: $version}}' > "$payload_file"
          for attempt in 1 2 3; do
            if gh api --method POST repos/froggy1014/meta-cloud-api-playground/dispatches --input "$payload_file"; then
              echo "Dispatched meta-cloud-api-released ($version)."
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "::error::Playground dispatch failed. Re-run playground sdk-update with version $version."
          exit 1
