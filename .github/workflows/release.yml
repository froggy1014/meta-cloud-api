name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): update versions"
          title: "chore(release): update versions"
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify playground of new meta-cloud-api release
        # Runs even when the publish step failed: a run can publish meta-cloud-api
        # and then fail on another package (create-whatsapp-app E403 in 3.8.0),
        # and changesets/action sets no outputs when its publish command fails.
        # So decide from the registry: dispatch only if the current version was
        # published after this job started.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.PLAYGROUND_DISPATCH_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          published_at=""
          for _ in $(seq 15); do
            published_at="$(npm view meta-cloud-api time --json 2>/dev/null | jq -r --arg v "$version" '.[$v] // empty')"
            [ -n "$published_at" ] && break
            # Not on the registry (yet). Only worth waiting if publishing was attempted.
            [ "${{ steps.changesets.outcome }}" = "skipped" ] && break
            sleep 20
          done
          if [ -z "$published_at" ]; then
            echo "meta-cloud-api@$version is not on npm; skipping playground dispatch."
            exit 0
          fi
          if [ "$(date -u -d "$published_at" +%s)" -lt "$JOB_STARTED_AT" ]; then
            echo "meta-cloud-api@$version was published before this run ($published_at); nothing to dispatch."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PLAYGROUND_DISPATCH_TOKEN is not set; skipping playground dispatch for meta-cloud-api@$version."
            exit 0
          fi
          jq -n --arg version "$version" \
            '{event_type: "meta-cloud-api-released", client_payload: {version: $version}}' \
            | gh api --method POST repos/froggy1014/meta-cloud-api-playground/dispatches --input -
          echo "Dispatched meta-cloud-api-released ($version) to froggy1014/meta-cloud-api-playground."
