name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Type Check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  scaffold:
    name: create-whatsapp-app smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # The root package.json pins pnpm via packageManager; this job only
          # uses npm (like a user running `npm create whatsapp-app`).
          package-manager-cache: false

      # Scaffold the basic template exactly as `npm create whatsapp-app` would,
      # then prove the generated app typechecks and builds against the
      # published SDK.
      - name: Scaffold
        run: node packages/create-whatsapp-app/bin/index.mjs "$RUNNER_TEMP/app" --yes --pm npm

      - name: Type Check generated app
        working-directory: ${{ runner.temp }}/app
        run: npm run typecheck

      - name: Build generated app
        working-directory: ${{ runner.temp }}/app
        run: npm run build
