name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Type Check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # examples/express-production is the "production-ready" reference app.
      # Typecheck and test it against the SDK built above so it cannot rot.
      - name: Example (express-production)
        working-directory: examples/express-production
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          pnpm exec prisma generate
          pnpm typecheck
          pnpm test

  scaffold:
    name: create-whatsapp-app smoke (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [basic, ai-agent]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # The root package.json pins pnpm via packageManager; this job only
          # uses npm (like a user running `npm create whatsapp-app`).
          package-manager-cache: false

      # Scaffold each template exactly as `npm create whatsapp-app` would,
      # then prove the generated app typechecks and builds against the
      # published SDK. No ANTHROPIC_API_KEY: the ai-agent runs in echo mode.
      - name: Scaffold
        run: node packages/create-whatsapp-app/bin/index.mjs "$RUNNER_TEMP/app" --yes --pm npm --template ${{ matrix.template }}

      - name: Type Check generated app
        working-directory: ${{ runner.temp }}/app
        run: npm run typecheck

      - name: Test generated app
        if: matrix.template == 'ai-agent'
        working-directory: ${{ runner.temp }}/app
        run: npm test

      - name: Build generated app
        working-directory: ${{ runner.temp }}/app
        run: npm run build
