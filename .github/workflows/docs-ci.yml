name: Docs CI

on:
    pull_request:
        branches: [main]
        paths:
            - 'README.md'
            - 'package.json'
            - 'website/**'
            - 'src/**'
            - 'scripts/check-doc-snippets.mjs'
            - '.github/workflows/docs-ci.yml'

jobs:
    snippets:
        name: Snippet type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Pages listed here have every ```typescript block compiled against src/.
            - name: Type-check doc snippets
              run: pnpm docs:check-snippets

    build:
        name: Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: website
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v5
              with:
                  node-version: '18'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm astro check

            - name: Build site
              run: pnpm build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: docs-build
                  path: website/dist
